name: Macaw Rescue APK (isolated build)
on:
  push:
    branches: [build/macaw-rescue-apk-v1]
    paths:
      - 'macaw_apk/**'
      - '.github/workflows/macaw-rescue-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK Platform
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check offline HTML scripts
        working-directory: macaw_apk
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html=Path('app/src/main/assets/index.html').read_text()
          scripts=re.findall(r'<script(?:[^>]*)>(.*?)</script>', html, re.S)
          for i, code in enumerate(scripts):
              if i == 0: continue  # JSON reference block
              Path(f'/tmp/macaw_checked_{i}.js').write_text(code)
          PY
          for f in /tmp/macaw_checked_*.js; do node --check "$f"; done
      - name: Build debug APK
        working-directory: macaw_apk
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify signature and metadata
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose macaw_apk/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging macaw_apk/app/build/outputs/apk/debug/app-debug.apk | head -5
          sha256sum macaw_apk/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Macaw-Rescue-Fieldbook-v6-debug-apk
          path: macaw_apk/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error