name: TCL Home AI Android 8 Debug APK
on:
  push:
    branches:
      - build/tcl-home-ai-android8-20261106
    paths:
      - 'tcl-home-ai/build-src.tar.xz'
      - '.github/workflows/tcl-home-ai-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify source archive checksum and extract
        run: |
          echo '2b49aaccd808e49fc51717c184e29508ca29e596c39bf4a0ade3cdee412ec998  tcl-home-ai/build-src.tar.xz' | sha256sum -c -
          mkdir -p tcl-home-ai/extracted
          tar -xJf tcl-home-ai/build-src.tar.xz -C tcl-home-ai/extracted
      - name: Ensure Android SDK 35
        run: |
          echo "ANDROID_HOME: ${ANDROID_HOME:-unset}"
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
      - name: Compile debug APK
        working-directory: tcl-home-ai/extracted/tcl-tv-assistant
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify artifact
        run: |
          test -s tcl-home-ai/extracted/tcl-tv-assistant/app/build/outputs/apk/debug/app-debug.apk
          unzip -t tcl-home-ai/extracted/tcl-tv-assistant/app/build/outputs/apk/debug/app-debug.apk | tail -1
          sha256sum tcl-home-ai/extracted/tcl-tv-assistant/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: TCL-Home-AI-Android8-debug-APK
          path: tcl-home-ai/extracted/tcl-tv-assistant/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
